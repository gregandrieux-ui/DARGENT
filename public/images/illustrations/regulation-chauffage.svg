<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Schéma de la régulation du chauffage : une sonde extérieure et un thermostat d&#39;ambiance informent la chaudière ou la pompe à chaleur, un robinet thermostatique règle chaque radiateur"><style>@media (prefers-reduced-motion: no-preference){path[marker-end="url(#an)"]{stroke-dasharray:22 8;animation:flow 1.2s linear infinite}path[marker-end="url(#ac)"]{stroke-dasharray:14 10;animation:flow 1.2s linear infinite}path[marker-end="url(#ac)"]{animation-name:flowc}@keyframes flow{to{stroke-dashoffset:-30}}@keyframes flowc{to{stroke-dashoffset:-24}}}</style>
<defs>
<marker id="an" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#005ca9"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2db8c5"/></marker>
<g id="rad"><rect width="140" height="56" rx="8" fill="#fff" stroke="#0b2a4a" stroke-width="5"/><path d="M24 12v32M48 12v32M72 12v32M96 12v32M118 12v32" stroke="#c9d5df" stroke-width="5"/><path d="M140 28h10" stroke="#0b2a4a" stroke-width="5"/><circle cx="162" cy="28" r="13" fill="#eaf3fa" stroke="#0b2a4a" stroke-width="4"/><path d="M156 20h12" stroke="#117a85" stroke-width="4"/></g>
</defs>
<rect width="800" height="600" fill="#eaf3fa"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif" stroke-linecap="round" stroke-linejoin="round">
<!-- maison en coupe, deux niveaux -->
<path d="M80 500V200H540V500" fill="#f4f8fb"/>
<path d="M56 214L310 76L564 214" fill="none" stroke="#0b2a4a" stroke-width="10"/>
<path d="M80 200V500M540 200V500" stroke="#0b2a4a" stroke-width="8"/>
<path d="M80 340H540" stroke="#0b2a4a" stroke-width="6"/>
<path d="M20 500H780" stroke="#0b2a4a" stroke-width="6"/>
<path d="M40 512l-14 14M80 512l-14 14M120 512l-14 14M160 512l-14 14M200 512l-14 14M240 512l-14 14M280 512l-14 14M320 512l-14 14M360 512l-14 14M400 512l-14 14M440 512l-14 14M480 512l-14 14M520 512l-14 14M560 512l-14 14M600 512l-14 14M640 512l-14 14M680 512l-14 14M720 512l-14 14M760 512l-14 14" stroke="#c9d5df" stroke-width="3"/>
<!-- sonde extérieure sur la façade -->
<rect x="40" y="398" width="30" height="40" rx="6" fill="#fff" stroke="#0b2a4a" stroke-width="4"/>
<path d="M72 418H116" stroke="#2db8c5" stroke-width="5" marker-end="url(#ac)"/>
<!-- générateur : chaudière ou PAC -->
<rect x="128" y="372" width="100" height="118" rx="10" fill="#fff" stroke="#0b2a4a" stroke-width="5"/>
<rect x="148" y="390" width="60" height="26" rx="5" fill="#eaf3fa" stroke="#0b2a4a" stroke-width="4"/>
<path d="M150 440h56M150 456h56" stroke="#c9d5df" stroke-width="4"/>
<!-- thermostat d'ambiance à l'étage -->
<rect x="156" y="244" width="44" height="58" rx="8" fill="#fff" stroke="#0b2a4a" stroke-width="4"/>
<circle cx="178" cy="266" r="10" fill="#eaf3fa" stroke="#117a85" stroke-width="4"/>
<path d="M178 306V358" stroke="#2db8c5" stroke-width="5" marker-end="url(#ac)"/>
<!-- départ vers les radiateurs -->
<path d="M228 392H280V286H330" fill="none" stroke="#005ca9" stroke-width="7" marker-end="url(#an)"/>
<path d="M228 450H330" stroke="#005ca9" stroke-width="7" marker-end="url(#an)"/>
<use href="#rad" x="342" y="258"/>
<use href="#rad" x="342" y="422"/>
<!-- repères -->
<g font-size="26" font-weight="700" fill="#fff" text-anchor="middle">
<circle cx="55" cy="364" r="22" fill="#0b2a4a"/><text x="55" y="373">1</text>
<circle cx="236" cy="252" r="22" fill="#0b2a4a"/><text x="236" y="261">2</text>
<circle cx="504" cy="236" r="22" fill="#0b2a4a"/><text x="504" y="245">3</text>
</g>
<!-- légende -->
<g font-size="22" fill="#0b2a4a">
<circle cx="584" cy="232" r="17" fill="#0b2a4a"/><text x="584" y="240" fill="#fff" font-weight="700" text-anchor="middle" font-size="20">1</text><text x="608" y="224">Sonde</text><text x="608" y="252">extérieure</text>
<circle cx="584" cy="312" r="17" fill="#0b2a4a"/><text x="584" y="320" fill="#fff" font-weight="700" text-anchor="middle" font-size="20">2</text><text x="608" y="304">Thermostat</text><text x="608" y="332">d&#39;ambiance</text>
<circle cx="584" cy="392" r="17" fill="#0b2a4a"/><text x="584" y="400" fill="#fff" font-weight="700" text-anchor="middle" font-size="20">3</text><text x="608" y="384">Robinets</text><text x="608" y="412">thermostatiques</text>
</g>
</g>
</svg>
