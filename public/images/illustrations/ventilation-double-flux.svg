<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Schéma d&#39;une ventilation double flux : l&#39;air neuf est préchauffé dans l&#39;échangeur par l&#39;air repris avant d&#39;être soufflé dans les pièces de vie, l&#39;air vicié est rejeté dehors"><style>@media (prefers-reduced-motion: no-preference){path[marker-end="url(#an)"]{stroke-dasharray:22 8;animation:flow 1.2s linear infinite}path[marker-end="url(#ac)"]{stroke-dasharray:14 10;animation:flow 1.2s linear infinite}path[marker-end="url(#ac)"]{animation-name:flowc}@keyframes flow{to{stroke-dashoffset:-30}}@keyframes flowc{to{stroke-dashoffset:-24}}}</style>
