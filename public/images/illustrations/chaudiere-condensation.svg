<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Schéma d&#39;une chaudière gaz à condensation : la ventouse amène l&#39;air neuf et évacue les fumées, la chaleur de la vapeur d&#39;eau des fumées est récupérée, l&#39;eau chauffée part vers les radiateurs et revient plus froide"><style>@media (prefers-reduced-motion: no-preference){path[marker-end="url(#an)"]{stroke-dasharray:22 8;animation:flow 1.2s linear infinite}path[marker-end="url(#ac)"]{stroke-dasharray:14 10;animation:flow 1.2s linear infinite}path[marker-end="url(#ac)"]{animation-name:flowc}@keyframes flow{to{stroke-dashoffset:-30}}@keyframes flowc{to{stroke-dashoffset:-24}}}</style>
<defs>
<marker id="an" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#005ca9"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2db8c5"/></marker>
</defs>
<rect width="800" height="600" fill="#eaf3fa"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif" stroke-linecap="round" stroke-linejoin="round">
<!-- pièce en coupe + mur de façade -->
<path d="M40 40H560V500H40Z" fill="#f4f8fb"/>
<path d="M560 40V78M560 142V500" stroke="#0b2a4a" stroke-width="10"/>
<path d="M20 500H780" stroke="#0b2a4a" stroke-width="6"/>
<path d="M40 512l-14 14M80 512l-14 14M120 512l-14 14M160 512l-14 14M200 512l-14 14M240 512l-14 14M280 512l-14 14M320 512l-14 14M360 512l-14 14M400 512l-14 14M440 512l-14 14M480 512l-14 14M520 512l-14 14M560 512l-14 14M600 512l-14 14M640 512l-14 14M680 512l-14 14M720 512l-14 14M760 512l-14 14" stroke="#c9d5df" stroke-width="3"/>
<text x="680" y="250" font-size="26" font-weight="700" fill="#117a85" text-anchor="middle">Extérieur</text>
<!-- ventouse : conduit double à travers le mur -->
<path d="M384 84H640V136H384Z" fill="#fff" stroke="#0b2a4a" stroke-width="5"/>
<path d="M384 110H640" stroke="#c9d5df" stroke-width="3"/>
<path d="M396 136V156M448 136V156" stroke="#0b2a4a" stroke-width="5"/>
<path d="M720 98H412V146" fill="none" stroke="#2db8c5" stroke-width="6" marker-end="url(#ac)"/>
<path d="M434 156V124H714" fill="none" stroke="#005ca9" stroke-width="6" marker-end="url(#an)"/>
<!-- chaudière murale -->
<rect x="330" y="156" width="170" height="210" rx="14" fill="#fff" stroke="#0b2a4a" stroke-width="5"/>
<path d="M356 200h66a10 10 0 0 1 0 20h-66a10 10 0 0 0 0 20h66a10 10 0 0 1 0 20h-66" fill="none" stroke="#c9d5df" stroke-width="6"/>
<path d="M392 330c-14 0-20-10-14-20 4-7 8-10 8-20 9 7 18 16 18 25 0 9-4 15-12 15z" fill="#eaf3fa" stroke="#005ca9" stroke-width="5"/>
<rect x="444" y="296" width="36" height="48" rx="6" fill="#eaf3fa" stroke="#0b2a4a" stroke-width="4"/>
<!-- condensats -->
<path d="M414 366V410a14 14 0 0 0 28 0V396" fill="none" stroke="#0b2a4a" stroke-width="5"/>
<path d="M428 430V470" stroke="#2db8c5" stroke-width="5" marker-end="url(#ac)"/>
<text x="456" y="460" font-size="22" fill="#4a5a68">condensats</text>
<!-- radiateur, départ / retour -->
<rect x="80" y="258" width="170" height="80" rx="8" fill="#fff" stroke="#0b2a4a" stroke-width="5"/>
<path d="M110 272v52M138 272v52M166 272v52M194 272v52M222 272v52" stroke="#c9d5df" stroke-width="5"/>
<path d="M330 236H290V270H262" fill="none" stroke="#005ca9" stroke-width="7" marker-end="url(#an)"/>
<path d="M250 326H290V350H318" fill="none" stroke="#2db8c5" stroke-width="7" marker-end="url(#ac)"/>
<!-- repères -->
<g font-size="26" font-weight="700" fill="#fff" text-anchor="middle">
<circle cx="600" cy="176" r="22" fill="#0b2a4a"/><text x="600" y="185">1</text>
<circle cx="520" cy="236" r="22" fill="#0b2a4a"/><text x="520" y="245">2</text>
<circle cx="165" cy="226" r="22" fill="#0b2a4a"/><text x="165" y="235">3</text>
</g>
<!-- légende -->
<g font-size="24" fill="#0b2a4a">
<circle cx="52" cy="566" r="15" fill="#0b2a4a"/><text x="52" y="574" fill="#fff" font-weight="700" text-anchor="middle" font-size="20">1</text><text x="76" y="574">Ventouse</text>
<circle cx="214" cy="566" r="15" fill="#0b2a4a"/><text x="214" y="574" fill="#fff" font-weight="700" text-anchor="middle" font-size="20">2</text><text x="238" y="574">Chaleur des fumées récupérée</text>
<circle cx="600" cy="566" r="15" fill="#0b2a4a"/><text x="600" y="574" fill="#fff" font-weight="700" text-anchor="middle" font-size="20">3</text><text x="624" y="574">Radiateurs</text>
</g>
</g>
</svg>
